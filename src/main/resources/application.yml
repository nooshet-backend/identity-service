server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: nooshet-identity-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgresql-identity}:5432/${DB_NAME:nooshet_identity}?sslmode=disable
    username: ${DB_USERNAME:nooshet_identity}
    password: ${DB_PASSWORD:identity_password_123}
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: ${SPRING_REDIS_TIMEOUT:2000ms}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@example.com} # TODO: Set your real email
    password: ${MAIL_PASSWORD:your-email-password} # TODO: Set your real password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  server-url: ${SPRINGDOC_SERVER_URL:/}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change-me-in-prod-please-use-a-longer-secret-key-123456}
  issuer: ${JWT_ISSUER:nooshet}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}

# OTP Configuration
otp:
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:3}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
  rate-limit:
    max-attempts: 5
    window-minutes: 15
    cooldown-seconds: 60
    min-cooldown-seconds: 5
    error-message-threshold-seconds: 30

logging:
  level:
    root: INFO
    org.nooshet.identity: DEBUG
    org.springframework.security: DEBUG

application:
  config:
    user-service-url: http://158.220.127.32
